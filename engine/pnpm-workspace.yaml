packages:
  - packages/*
  - apps/*
  - apps/vis/server
  - apps/vis/web
  - docs

# pnpm 12 blocks dependency lifecycle scripts unless each package is reviewed.
# Native/runtime prerequisites are allowed; informational-only scripts stay off.
allowBuilds:
  '@google/genai': false
  '@vscode/vsce-sign': true
  core-js: false
  core-js-pure: false
  esbuild: true
  keytar: true
  msw: false
  node-pty: true
  protobufjs: true
  ssh2: true
  tree-sitter-bash: true

catalog:
  zod: 4.6.7

overrides:
  "body-parser@2.3.0": "2.4.0"
  "fast-uri@3.1.8": "3.1.9"
  "fast-uri@4.2.2": "4.2.3"
  "zod@4.3.6": "4.6.7"
  "@modelcontextprotocol/sdk>@hono/node-server": "2.1.3"
  "kimi-code>@tailwindcss/vite": "4.1.18"
  "kimi-code>tailwindcss": "4.1.18"
  "micromark-extension-math>katex": "0.18.2"
  "rehype-katex>katex": "0.18.2"
  "ssh2@1.17.0>cpu-features": "-"
  "ssh2@1.17.0>nan": "-"
