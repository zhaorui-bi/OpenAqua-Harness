name: Desktop packages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/desktop.yml'
      - 'build/**'
      - 'engine/apps/openaqua-harness/**'
      - 'engine/apps/kimi-code/**'
      - 'engine/packages/**'
      - 'engine/package.json'
      - 'engine/pnpm-lock.yaml'
      - 'engine/pnpm-workspace.yaml'
      - 'main.js'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'SBOM.spdx.json'
      - 'THIRD_PARTY_NOTICES.md'
  pull_request:
    paths:
      - '.github/workflows/desktop.yml'
      - 'build/**'
      - 'engine/apps/openaqua-harness/**'
      - 'engine/apps/kimi-code/**'
      - 'engine/packages/**'
      - 'engine/package.json'
      - 'engine/pnpm-lock.yaml'
      - 'engine/pnpm-workspace.yaml'
      - 'main.js'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'SBOM.spdx.json'
      - 'THIRD_PARTY_NOTICES.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package and launch (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.15.0
          cache: npm

      - name: Use the pinned npm release
        run: npm install --global npm@12.0.2

      - name: Install root dependencies
        run: npm ci

      - name: Install engine dependencies and build
        run: npm run setup

      - name: Verify compliance manifests
        run: npm run check:licenses

      - name: Build native desktop artifacts
        run: npm run dist -- --publish never

      - name: Configure the Linux Chromium sandbox
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sandbox="$(find dist -path '*/chrome-sandbox' -type f -print -quit)"
          test -n "$sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"

      - name: Launch packaged desktop application
        run: npm run smoke:desktop

      - name: Generate SHA-256 checksums
        run: npm run checksums

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openaqua-desktop-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/OpenAqua-Harness-*
            dist/SHA256SUMS
            SBOM.spdx.json
            THIRD_PARTY_NOTICES.md
